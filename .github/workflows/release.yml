name: Release

# Publishes ghcr.io/zoolapp/quancard-server for a version tag (v1.2.3).
# Images carry SLSA provenance and an SBOM; the web bundle hashes are attached to the GitHub release
# so anyone can compare what their server serves with what this repository built.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build && pnpm -r test
        env:
          QC_VERSION: ${{ github.ref_name }}
      - name: Web bundle checksums
        run: |
          cd apps/web/dist
          find . -type f | sort | xargs sha256sum > ../../../web-bundle-SHA256SUMS.txt
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/zoolapp/quancard-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: QC_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: web-bundle-SHA256SUMS.txt
          generate_release_notes: true
