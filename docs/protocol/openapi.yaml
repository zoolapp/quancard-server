openapi: 3.1.0
info:
  title: QuanCard Server API
  version: 1.0.0
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  description: 'HTTP API implemented by the server. All JSON request objects described here reject unknown properties.
    Routes without a requestBody do not inspect a parsed body. Binary revision uploads contain an opaque sync-v1
    envelope JSON object, not a JSON API wrapper. Base64 fields use the standard padded alphabet. Timestamps are
    Unix seconds.


    API requests require HTTPS and a Host matching the configured public origin, with an explicitly configured localhost
    development exception. GET /healthz bypasses these checks. Non-Bearer API writes require Origin matching the
    allowed origin and X-QuanCard-Client: web, including unauthenticated setup and login; /api/v1/pairings/claim
    is exempt. The Bearer-prefix exemption is a transport guard and does not grant authentication or access.


    Session cookies are host-only, Secure, HttpOnly and SameSite=Strict. Device bearer tokens begin with qcd_ and
    can only access manifest and revisions of their paired vault. A recognized qcd_ bearer credential takes precedence
    over a session cookie. API responses use Cache-Control: no-store. Errors use Error and HTTP 429 also includes
    Retry-After. HEAD counterparts are automatically exposed and return no body.


    When webRoot is configured, the server additionally serves deployment-dependent static files and returns its
    HTML index for unmatched non-API GET/HEAD requests when that index exists. Those asset paths are not fixed API
    endpoints. Unmatched API requests, and unmatched requests without an applicable web fallback, return 404 with
    error notFound after transport checks. Insecure non-API requests other than GET /healthz return a plain-text
    426 response.'
servers:
- url: https://vault.example.com
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check server liveness
      description: Unauthenticated GET health check. Bypasses HTTPS, Host and Origin checks, including direct container
        health checks.
      security: []
      responses:
        '200':
          description: Server is alive.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    const: true
        '500':
          $ref: '#/components/responses/Internal'
    head:
      operationId: headGetHealth
      summary: 'Get headers: Check server liveness'
      description: Automatically exposed by Fastify for this GET route. Uses the same handler and authentication,
        but suppresses response bodies, including Error bodies. Only GET /healthz bypasses transport and Host checks.
      security: []
      responses:
        '200':
          description: Server is alive. HEAD responses have no body.
        '421':
          description: 'misdirectedRequest: Host does not match the configured public origin. No response body.'
        '426':
          description: HTTPS required. Unlike GET /healthz, HEAD is not exempt; the underlying non-API error representation
            is plain text, not the JSON Error schema. No response body.
          headers:
            Connection:
              schema:
                type: string
                const: close
        '500':
          description: 'internal: unexpected server failure. HEAD responses have no body.'
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Get server and setup status
      description: Public service metadata; no session required.
      security: []
      responses:
        '200':
          description: Current server status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - service
                - version
                - setupRequired
                - setupEnabled
                - protocol
                - capabilities
                - limits
                properties:
                  service:
                    type: string
                    const: quancard-server
                  version:
                    type: string
                    description: Configured server build version.
                  setupRequired:
                    type: boolean
                  setupEnabled:
                    type: boolean
                  protocol:
                    type: object
                    additionalProperties: false
                    required:
                    - auth
                    - sync
                    - envelope
                    properties:
                      auth:
                        type: integer
                        const: 1
                      sync:
                        type: integer
                        const: 1
                      envelope:
                        type: integer
                        const: 1
                  capabilities:
                    type: object
                    description: Feature discovery. Clients branch on these fields, never on `version`. New fields may be added.
                    required:
                    - payloadSchemas
                    - pairing
                    - twoFactor
                    - passkeys
                    - invites
                    - multipleVaults
                    properties:
                      payloadSchemas:
                        type: array
                        items:
                          type: integer
                      pairing:
                        type: integer
                        const: 1
                      twoFactor:
                        type: array
                        items:
                          type: string
                          enum:
                          - totp
                          - recoveryCode
                      passkeys:
                        type: boolean
                        description: true once passkey v1 (docs/protocol/passkey-v1.md) is implemented.
                      invites:
                        type: boolean
                      multipleVaults:
                        type: boolean
                  limits:
                    type: object
                    additionalProperties: false
                    required:
                    - revisionsPerVault
                    - bytesPerVault
                    - vaultsPerAccount
                    properties:
                      revisionsPerVault:
                        type: integer
                      bytesPerVault:
                        type: integer
                      vaultsPerAccount:
                        type: integer
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '500':
          $ref: '#/components/responses/Internal'
    head:
      operationId: headGetStatus
      summary: 'Get headers: Get server and setup status'
      description: Automatically exposed by Fastify for this GET route. Uses the same handler and authentication,
        but suppresses response bodies, including Error bodies.
      security: []
      responses:
        '200':
          description: Current server status. HEAD responses have no body.
        '421':
          description: 'misdirectedRequest: Host does not match the configured public origin (except permitted local
            development requests). HEAD responses have no body.'
        '426':
          description: 'httpsRequired: HTTPS is required; only explicitly enabled localhost development is exempt.
            HEAD responses have no body.'
          headers:
            Connection:
              schema:
                type: string
                const: close
              description: The server closes the insecure connection.
        '500':
          description: 'internal: unexpected server failure. HEAD responses have no body.'
  /api/v1/setup:
    post:
      operationId: setupOwner
      summary: Create the initial owner
      description: Available only with a configured setup token and an empty user database. Limited to 10 attempts
        per minute per client.
      security: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '201':
          description: Owner created; session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            Set-Cookie:
              description: Sets __Host-qc_session with Path=/, HttpOnly, Secure and SameSite=Strict, no Domain,
                and the configured absolute-session Max-Age.
              schema:
                type: string
        '400':
          description: 'badRequest: malformed or unknown fields, invalid UUID/Base64 or account-key envelope. invalidUsername:
            invalid normalized username.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'setupClosed: setup token is disabled or any user already exists; invalidSetupToken: incorrect
            setup token; crossOriginRejected: browser write headers failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'usernameTaken: username already exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/invites:
    post:
      operationId: createInvite
      summary: Create a registration invite
      description: Owner session required. No request body is required or inspected; a parsed body is ignored.
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      responses:
        '201':
          description: Single-use invite created; expires after 7 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeWithExpiry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 'forbidden: only the owner may create invites; crossOriginRejected: browser write headers
            failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/register:
    post:
      operationId: registerAccount
      summary: Register using an invite
      description: Creates a non-owner account with a single-use invite. Limited to 10 attempts per minute per client.
      security: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created, invite consumed and session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            Set-Cookie:
              description: Sets __Host-qc_session with Path=/, HttpOnly, Secure and SameSite=Strict, no Domain,
                and the configured absolute-session Max-Age.
              schema:
                type: string
        '400':
          description: 'badRequest: malformed or unknown fields, invalid UUID/Base64 or account-key envelope. invalidUsername:
            invalid normalized username.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'invalidInvite: unknown, used or expired invite; crossOriginRejected: browser write headers
            failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'usernameTaken: username already exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/auth/prelogin:
    post:
      operationId: prelogin
      summary: Get account KDF parameters
      description: Unknown usernames receive a stable decoy salt without revealing account existence. Limited to
        10 attempts per minute per client.
      security: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreloginRequest'
      responses:
        '200':
          description: KDF parameters with the real or a stable decoy salt.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - kdf
                properties:
                  kdf:
                    $ref: '#/components/schemas/Kdf'
        '400':
          description: 'badRequest: malformed or unknown fields; invalidUsername: invalid normalized username.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate and create a browser session
      description: The password remains client-side. Supply its derived authentication key and a second factor when
        TOTP is enabled. A string totp takes precedence over recoveryCode; factors are ignored when TOTP is disabled.
      security: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated account; session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            Set-Cookie:
              description: Sets __Host-qc_session with Path=/, HttpOnly, Secure and SameSite=Strict, no Domain,
                and the configured absolute-session Max-Age.
              schema:
                type: string
        '400':
          description: 'badRequest: malformed or unknown fields or invalid authentication-key Base64; invalidUsername:
            invalid normalized username.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'invalidCredentials: incorrect authentication key; secondFactorRequired: enabled TOTP requires
            a factor; invalidSecondFactor: invalid or replayed TOTP, or invalid/used recovery code.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '429':
          description: 'rateLimited: more than 10 login attempts per minute per client; accountLocked: account locked
            for 15 minutes after 10 failed authentication-key checks. The tenth failure still returns invalidCredentials;
            subsequent attempts during the lock return accountLocked.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Seconds until another attempt is allowed; also returned as retryAfterSeconds.
              schema:
                type: integer
                minimum: 1
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current browser session
      description: Succeeds without valid credentials. A device token is not revoked. No request body is required
        or inspected.
      security:
      - {}
      - session: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      responses:
        '204':
          description: Session revoked if present and cookie cleared; no response body.
          headers:
            Set-Cookie:
              description: Clears __Host-qc_session with Path=/, HttpOnly, Secure and SameSite=Strict.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/account:
    get:
      operationId: getAccount
      summary: Get the signed-in account
      description: Requires a browser session; device tokens are not accepted.
      security:
      - session: []
      responses:
        '200':
          description: Current account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: deleteAccount
      summary: Delete the signed-in account
      description: Requires fresh authentication and username confirmation. Related records are removed by database
        cascades. Owner deletion is blocked while members remain. Unexpected database failures return internal.
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Account deleted and cookie cleared; no response body.
          headers:
            Set-Cookie:
              description: Clears __Host-qc_session with Path=/, HttpOnly, Secure and SameSite=Strict.
              schema:
                type: string
        '400':
          description: 'badRequest: malformed fields or Base64; confirmationMismatch: confirmation does not match
            the stored username after normalization.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'unauthorized: a valid session is required. invalidCredentials: the supplied authentication
            key is incorrect.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '409':
          description: 'ownerHasMembers: the owner cannot delete the account while other users exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
    head:
      operationId: headGetAccount
      summary: 'Get headers: Get the signed-in account'
      description: Automatically exposed by Fastify for this GET route. Uses the same handler and authentication,
        but suppresses response bodies, including Error bodies.
      security:
      - session: []
      responses:
        '200':
          description: Current account. HEAD responses have no body.
        '401':
          description: 'unauthorized: no valid session, or a device token used on a session-only endpoint. HEAD
            responses have no body.'
        '421':
          description: 'misdirectedRequest: Host does not match the configured public origin (except permitted local
            development requests). HEAD responses have no body.'
        '426':
          description: 'httpsRequired: HTTPS is required; only explicitly enabled localhost development is exempt.
            HEAD responses have no body.'
          headers:
            Connection:
              schema:
                type: string
                const: close
              description: The server closes the insecure connection.
        '500':
          description: 'internal: unexpected server failure. HEAD responses have no body.'
  /api/v1/account/password:
    post:
      operationId: changePassword
      summary: Change credentials and rewrap the account key
      description: Verifies currentAuthKey, replaces the salt, authentication key and wrapped account key, revokes
        every session, then issues a new session to this browser. The wrapped envelope must remain bound to this
        accountID.
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordRequest'
      responses:
        '200':
          description: Updated account and replacement session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
          headers:
            Set-Cookie:
              description: Sets __Host-qc_session with Path=/, HttpOnly, Secure and SameSite=Strict, no Domain,
                and the configured absolute-session Max-Age.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 'unauthorized: a valid session is required. invalidCredentials: the supplied authentication
            key is incorrect.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '409':
          description: 'staleCredentials: the account changed (for example another password change) after the current
            password was verified; nothing was changed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '429':
          description: 'rateLimited or accountLocked; Retry-After is set.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/account/totp/setup:
    post:
      operationId: setupTotp
      summary: Prepare TOTP enrollment
      description: Requires fresh authentication. Creates or replaces the pending TOTP secret without enabling it.
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreshAuthRequest'
      responses:
        '200':
          description: Pending authenticator setup URI.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - otpauthURI
                properties:
                  otpauthURI:
                    type: string
                    format: uri
                    description: otpauth:// URI with issuer QuanCard, SHA1, six digits and a 30-second period.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 'unauthorized: a valid session is required. invalidCredentials: the supplied authentication
            key is incorrect.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '409':
          description: 'totpAlreadyEnabled: TOTP is already enabled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/account/totp/enable:
    post:
      operationId: enableTotp
      summary: Confirm TOTP enrollment
      description: Requires a session and a code for the pending secret. Accepts one 30-second step of clock skew
        in either direction. The accepted step is recorded to reject later login replay. Limited to 10 attempts
        per minute per account.
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
      responses:
        '200':
          description: TOTP enabled; save these ten single-use recovery codes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - recoveryCodes
                properties:
                  recoveryCodes:
                    type: array
                    items:
                      type: string
                      pattern: ^[A-Z2-7]{4}(-[A-Z2-7]{4}){3}$
                    minItems: 10
                    maxItems: 10
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 'unauthorized: valid session required; invalidSecondFactor: code does not validate against
            the pending secret.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '409':
          description: 'totpNotPending: no pending secret exists, or TOTP is already enabled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
  /api/v1/account/totp/disable:
    post:
      operationId: disableTotp
      summary: Disable TOTP and clear recovery codes
      description: Requires fresh authentication and a valid second factor if TOTP is enabled. Clears enabled and
        pending TOTP secrets and recovery codes. Succeeds with fresh authentication alone if TOTP is already disabled.
      security:
      - session: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      requestBody:
        required: true
