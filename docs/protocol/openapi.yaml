  /api/v1/vaults/{vaultID}/revisions/{revisionID}:
    put:
      operationId: putRevision
      summary: Store an immutable revision
      description: 'Upload raw opaque sync-v1 envelope JSON bytes, at most 16 MiB (16777216 bytes). Content-Type
        must be application/octet-stream. The server validates only the outer envelope: objectKind syncRevision.v1
        and recordID equal to revisionID. Encrypted vault identity and revision contents cannot be inspected by
        the server. Identical bytes are idempotent and are acknowledged before quota checks. Device tokens may upload
        only to their paired vault; Bearer requests are exempt from browser-write headers.'
      security:
      - session: []
      - device: []
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/WebClient'
      responses:
        '200':
          description: Identical retry acknowledged with the original sequence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionReceipt'
        '201':
          description: Revision stored with a new sequence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionReceipt'
        '400':
          description: 'badRequest: invalid path UUID or request parsing failure; invalidEnvelope: malformed envelope,
            wrong objectKind or recordID, or oversized envelope detected during envelope validation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'revisionConflict: this revisionID already has different bytes in the vault.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '500':
          $ref: '#/components/responses/Internal'
        '507':
          description: 'capacity: adding this revision would exceed the configured per-vault revision count or total-byte
            quota.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        description: Opaque sync-v1 envelope JSON bytes; maximum 16 MiB. Send the bytes directly, without an outer
          JSON wrapper or Base64 encoding.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 16777216
              contentMediaType: application/json
              contentSchema:
                $ref: '#/components/schemas/RevisionEnvelope'
              description: Raw UTF-8 envelope JSON bytes. The decoded JSON object has exactly the properties in
                RevisionEnvelope.
    parameters:
    - $ref: '#/components/parameters/vaultID'
    - $ref: '#/components/parameters/revisionID'
