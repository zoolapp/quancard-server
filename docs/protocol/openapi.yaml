          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CrossOriginRejected'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '421':
          $ref: '#/components/responses/MisdirectedRequest'
        '426':
          $ref: '#/components/responses/HttpsRequired'
        '500':
          $ref: '#/components/responses/Internal'
    parameters:
    - $ref: '#/components/parameters/deviceID'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-qc_session
      description: Browser session cookie. Device tokens cannot substitute for a session on account, vault-management
        or device-management endpoints.
    device:
      type: http
      scheme: bearer
      bearerFormat: qcd_<opaque token>
      description: Opaque device token issued by pairing claim. Only accepts manifest GET/HEAD, revisions GET/HEAD
        and revision PUT for its single paired vault.
  parameters:
    Origin:
      name: Origin
      in: header
      required: false
      description: Required for browser/API writes without an Authorization header beginning with Bearer, except
        /api/v1/pairings/claim. Must equal the configured public origin; explicitly enabled localhost development
        must match the request host. Conditional requirement cannot be expressed by required alone.
      schema:
        type: string
      example: https://vault.example.com
    WebClient:
      name: X-QuanCard-Client
      in: header
      required: false
      description: Required with value web for writes subject to the Origin check. Bearer requests and /api/v1/pairings/claim
        are exempt.
      schema:
        type: string
        const: web
    vaultID:
      name: vaultID
      in: path
      required: true
      description: Uppercase canonical UUID v4.
      schema:
        $ref: '#/components/schemas/UUID'
    revisionID:
      name: revisionID
      in: path
      required: true
      description: Uppercase canonical UUID v4.
      schema:
        $ref: '#/components/schemas/UUID'
    deviceID:
      name: deviceID
      in: path
      required: true
      description: Uppercase canonical UUID v4.
      schema:
        $ref: '#/components/schemas/UUID'
  responses:
    BadRequest:
      description: 'badRequest: malformed request, invalid field type or value, unknown JSON body property, invalid
        UUID or request parsing error.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'unauthorized: no valid session, or a device token used on a session-only endpoint.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CrossOriginRejected:
      description: 'crossOriginRejected: a non-Bearer API write lacks an allowed Origin or X-QuanCard-Client: web.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'notFound: resource does not exist, belongs to another account, or is outside the device token''s
        vault.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 'payloadTooLarge: the request exceeds the applicable body limit. JSON bodies default to 1 MiB;
        vault creation allows 64 KiB and revision uploads allow 16 MiB. Even endpoints that ignore bodies can fail
        while parsing a supplied body.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'unsupportedMediaType: missing, malformed or unsupported Content-Type for a supplied body; revision
        uploads require application/octet-stream.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MisdirectedRequest:
      description: 'misdirectedRequest: Host does not match the configured public origin (except permitted local
        development requests).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HttpsRequired:
      description: 'httpsRequired: HTTPS is required; only explicitly enabled localhost development is exempt.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Connection:
          schema:
            type: string
            const: close
          description: The server closes the insecure connection.
    RateLimited:
      description: 'rateLimited: more than 10 attempts in a 60-second window for the applicable client or account
        bucket.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed; also returned as retryAfterSeconds.
          schema:
            type: integer
            minimum: 1
    Internal:
      description: 'internal: unexpected server failure.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          description: Machine-readable error code; possible codes are listed for each response.
        retryAfterSeconds:
          type: integer
          minimum: 1
          description: Present for rateLimited and accountLocked responses; seconds to wait.
    UUID:
      type: string
      pattern: ^[0-9A-F]{8}-[0-9A-F]{4}-4[0-9A-F]{3}-[89AB][0-9A-F]{3}-[0-9A-F]{12}$
      description: Uppercase canonical UUID version 4.
    Timestamp:
      type: integer
      description: Unix timestamp in seconds.
    Username:
      type: string
      description: NFC-normalized and trimmed before validation. The normalized value must contain 3 to 64 Unicode
        letters or numbers, or the characters . _ @ + -. Invalid syntax returns invalidUsername; a non-string returns
        badRequest.
    AuthKey:
      type: string
      contentEncoding: base64
      description: Standard padded Base64 (RFC 4648 standard alphabet). Exactly 32 decoded bytes. Derived authentication
        key, never the plaintext password.
      minLength: 44
      maxLength: 44
    KdfSalt:
      type: string
      contentEncoding: base64
      description: Standard padded Base64 (RFC 4648 standard alphabet). Exactly 16 decoded bytes.
      minLength: 24
      maxLength: 24
    WrappedAccountKey:
      type: string
      contentEncoding: base64
      description: Standard padded Base64 (RFC 4648 standard alphabet). Serialized envelope JSON, at most 4096 decoded
        bytes. objectKind must be accountKey.v1 and recordID must match the accountID.
      maxLength: 5464
    WrappedVaultKey:
      type: string
      contentEncoding: base64
      description: Standard padded Base64 (RFC 4648 standard alphabet). Serialized envelope JSON, at most 4096 decoded
        bytes. objectKind must be vaultKey.v1 and recordID must match the vaultID.
      maxLength: 5464
    ManifestBase64:
      type: string
      contentEncoding: base64
      description: Standard padded Base64 (RFC 4648 standard alphabet). Serialized sync-v1 manifest envelope JSON,
        at most 8192 decoded bytes. objectKind must be syncManifest.v1 and recordID must match the vaultID.
      maxLength: 10924
    Kdf:
      type: object
      additionalProperties: false
      required:
      - algorithm
      - memoryKiB
      - iterations
      - parallelism
      - outputBytes
      - normalization
      - salt
      properties:
        algorithm:
          type: string
          const: argon2id-1.3
        memoryKiB:
          type: integer
          const: 65536
        iterations:
          type: integer
          const: 3
        parallelism:
          type: integer
          const: 1
        outputBytes:
          type: integer
          const: 32
        normalization:
          type: string
          const: NFC
        salt:
          $ref: '#/components/schemas/KdfSalt'
    Account:
      type: object
      additionalProperties: false
      required:
      - accountID
      - username
      - isOwner
      - kdf
      - wrappedAccountKey
      - totpEnabled
      - recoveryCodesRemaining
      - createdAt
      - passwordChangedAt
      properties:
        accountID:
          $ref: '#/components/schemas/UUID'
        username:
          type: string
        isOwner:
          type: boolean
        kdf:
          $ref: '#/components/schemas/Kdf'
        wrappedAccountKey:
          $ref: '#/components/schemas/WrappedAccountKey'
        totpEnabled:
          type: boolean
        recoveryCodesRemaining:
          type: integer
          minimum: 0
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        passwordChangedAt:
          $ref: '#/components/schemas/Timestamp'
    SetupRequest:
      type: object
      additionalProperties: false
      required:
      - setupToken
      - username
      - accountID
      - kdfSalt
      - authKey
      - wrappedAccountKey
      properties:
        setupToken:
          type: string
          minLength: 1
          maxLength: 256
        username:
          $ref: '#/components/schemas/Username'
        accountID:
          $ref: '#/components/schemas/UUID'
        kdfSalt:
          $ref: '#/components/schemas/KdfSalt'
        authKey:
          $ref: '#/components/schemas/AuthKey'
        wrappedAccountKey:
          $ref: '#/components/schemas/WrappedAccountKey'
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - inviteCode
      - username
      - accountID
      - kdfSalt
      - authKey
      - wrappedAccountKey
      properties:
        inviteCode:
          type: string
          minLength: 1
          maxLength: 64
        username:
          $ref: '#/components/schemas/Username'
        accountID:
          $ref: '#/components/schemas/UUID'
        kdfSalt:
          $ref: '#/components/schemas/KdfSalt'
        authKey:
          $ref: '#/components/schemas/AuthKey'
        wrappedAccountKey:
          $ref: '#/components/schemas/WrappedAccountKey'
    PreloginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      properties:
        username:
          $ref: '#/components/schemas/Username'
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - username
      - authKey
      properties:
        username:
          $ref: '#/components/schemas/Username'
        authKey:
          $ref: '#/components/schemas/AuthKey'
        totp:
          type: string
          description: Six-digit TOTP. When TOTP is enabled, a string here takes precedence over recoveryCode. Factors
            are ignored when TOTP is disabled; non-string values are treated as absent.
        recoveryCode:
          type: string
          description: Single-use recovery code; normalized to uppercase with characters outside A-Z and 2-7 removed.
            Used only when totp is not a string.
    PasswordRequest:
      type: object
      additionalProperties: false
      required:
      - currentAuthKey
      - kdfSalt
      - authKey
      - wrappedAccountKey
      properties:
        currentAuthKey:
          $ref: '#/components/schemas/AuthKey'
        kdfSalt:
          $ref: '#/components/schemas/KdfSalt'
        authKey:
          $ref: '#/components/schemas/AuthKey'
        wrappedAccountKey:
          $ref: '#/components/schemas/WrappedAccountKey'
    FreshAuthRequest:
      type: object
      additionalProperties: false
      required:
      - authKey
      properties:
        authKey:
          $ref: '#/components/schemas/AuthKey'
    TotpEnableRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 6
          description: A valid six-digit TOTP is required for success. Empty, non-string or overlong values return
            badRequest; other invalid codes return invalidSecondFactor.
    TotpDisableRequest:
      type: object
      additionalProperties: false
      required:
      - authKey
      properties:
        authKey:
          $ref: '#/components/schemas/AuthKey'
        totp:
          type: string
          description: Six-digit TOTP. When TOTP is enabled, a string here takes precedence over recoveryCode. Factors
            are ignored when TOTP is disabled; non-string values are treated as absent.
        recoveryCode:
          type: string
          description: Single-use recovery code; normalized to uppercase with characters outside A-Z and 2-7 removed.
            Used only when totp is not a string.
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required:
      - authKey
      - confirm
      properties:
        authKey:
          $ref: '#/components/schemas/AuthKey'
        confirm:
          type: string
          maxLength: 64
          description: Must match the stored username after removing ASCII control characters and trimming whitespace.
            Missing or null confirmation also returns confirmationMismatch.
    CreateVaultRequest:
      type: object
      additionalProperties: false
      required:
      - vaultID
      - manifest
      - wrappedKey
      properties:
        vaultID:
          $ref: '#/components/schemas/UUID'
        manifest:
          $ref: '#/components/schemas/ManifestBase64'
        wrappedKey:
          $ref: '#/components/schemas/WrappedVaultKey'
    ClaimPairingRequest:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[A-Za-z0-9_-]{32}$
          description: Single-use pairing code. Missing, malformed, expired, used or unknown codes return pairingInvalid.
        deviceName:
          type:
          - string
          - 'null'
          maxLength: 64
          description: ASCII control characters are removed and whitespace trimmed. Defaults to iPhone when omitted,
            null or empty after normalization.
    Vault:
      type: object
      additionalProperties: false
      required:
      - vaultID
      - wrappedKey
      - createdAt
      - modifiedAt
      - revisionCount
      - totalBytes
      - lastSeq
      - quota
      properties:
        vaultID:
          $ref: '#/components/schemas/UUID'
        wrappedKey:
          $ref: '#/components/schemas/WrappedVaultKey'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        modifiedAt:
          $ref: '#/components/schemas/Timestamp'
        revisionCount:
          type: integer
          minimum: 0
        totalBytes:
          type: integer
          minimum: 0
          description: Total stored revision envelope bytes.
        lastSeq:
          type: integer
          minimum: 0
        quota:
          type: object
          additionalProperties: false
          required:
          - revisionCount
          - totalBytes
          properties:
            revisionCount:
              type: integer
            totalBytes:
              type: integer
    RevisionEnvelope:
      type: object
      additionalProperties: false
      required:
      - formatVersion
      - recordID
      - objectKind
      - wrappedDEK
      - payload
      properties:
        formatVersion:
          type: integer
          const: 1
        recordID:
          $ref: '#/components/schemas/UUID'
        objectKind:
          type: string
          const: syncRevision.v1
        wrappedDEK:
          type: string
          contentEncoding: base64
          description: 'Standard padded Base64 (RFC 4648 standard alphabet). Exactly 60 decoded bytes: nonce, encrypted
            DEK and authentication tag.'
          minLength: 80
          maxLength: 80
        payload:
          type: string
          contentEncoding: base64
          description: 'Standard padded Base64 (RFC 4648 standard alphabet). At least 28 decoded bytes: nonce, encrypted
            payload and authentication tag.'
          minLength: 40
      description: Outer JSON structure only. recordID must equal the revisionID path parameter. Unknown and duplicate
        JSON keys are rejected. Encrypted contents remain opaque to the server.
    RevisionReceipt:
      type: object
      additionalProperties: false
      required:
      - revisionID
      - seq
      properties:
        revisionID:
          $ref: '#/components/schemas/UUID'
        seq:
          type: integer
          minimum: 1
    RevisionPage:
      type: object
      additionalProperties: false
      required:
      - revisions
      - nextAfter
      - hasMore
      - lastSeq
      - modifiedAt
      properties:
        revisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - revisionID
            - seq
            - createdAt
            - body
            properties:
              revisionID:
                $ref: '#/components/schemas/UUID'
              seq:
                type: integer
                minimum: 1
              createdAt:
                $ref: '#/components/schemas/Timestamp'
              body:
                type: string
                contentEncoding: base64
                description: Standard padded Base64 (RFC 4648 standard alphabet). Stored sync-v1 revision envelope
                  JSON bytes.
          maxItems: 500
        nextAfter:
          type: integer
          minimum: 0
          description: Last sequence in this page, or the requested after value if empty.
        hasMore:
          type: boolean
        lastSeq:
          type: integer
          minimum: 0
          description: Current highest sequence in the vault.
        modifiedAt:
          $ref: '#/components/schemas/Timestamp'
    CodeWithExpiry:
      type: object
      additionalProperties: false
      required:
      - code
      - expiresAt
      properties:
        code:
          type: string
          description: Opaque URL-safe token; use as returned.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    Session:
      type: object
      additionalProperties: false
      required:
      - id
      - current
      - createdAt
      - lastSeenAt
      - expiresAt
      - client
      properties:
        id:
          type: string
          description: Opaque public session identifier, not a UUID or session cookie.
        current:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        client:
          type:
          - string
          - 'null'
          description: Coarse browser and operating-system label.
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - at
      - event
      - client
      properties:
        id:
          type: integer
        at:
          $ref: '#/components/schemas/Timestamp'
        event:
          type: string
        client:
          type:
          - string
          - 'null'
          description: Pseudonymous client IP tag.
    Device:
      type: object
      additionalProperties: false
      required:
      - deviceID
      - vaultID
      - name
      - createdAt
      - lastSeenAt
      properties:
        deviceID:
          $ref: '#/components/schemas/UUID'
        vaultID:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastSeenAt:
          type:
          - integer
          - 'null'
          description: Unix timestamp in seconds, or null before the device authenticates.
